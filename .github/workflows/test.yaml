name: Test

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  pull_request:
    types: [synchronize, opened, reopened]

jobs:
  # Fast, and needs neither SPIRE nor Kubernetes: it mounts the filesystem
  # against the real kernel and drives the read syscalls directly. Which syscall
  # a reader picks varies by tool and version, so asserting through cat or
  # busybox tests those rather than us.
  read-paths:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26'
          cache: false

      - name: Unit tests
        run: 'go test ./...'

      - name: Read paths against a real fuse mount
        # Mounting needs privileges, so this cannot run as the normal user. The
        # test skips itself rather than failing when it cannot mount.
        run: sudo env "PATH=$PATH" "GOFLAGS=$GOFLAGS" go test -v -run TestReadPaths ./...

  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26'
          cache: false

      - name: Install yq
        run: go install github.com/mikefarah/yq/v4@latest

      - name: Install BusyBox and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox jq

      - name: Unit tests
        run: 'go test ./...'

      - name: Run test
        run: 'tests/test.sh'
