# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    main: .
    binary: spiffefs

archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers:
  - image_templates:
      - "ghcr.io/ghcr.io/spiffe/spiffefs:latest"
      - "ghcr.io/ghcr.io/spiffe/spiffefs:{{ .Version }}"
    dockerfile: Dockerfile
    
    use: buildx 
    
    image_build_templates:
      - "ghcr.io/ghcr.io/spiffe/spiffefs:latest --platform=linux/amd64"
      - "ghcr.io/ghcr.io/spiffe/spiffefs:latest --platform=linux/arm64"
      - "ghcr.io/ghcr.io/spiffe/spiffefs:{{ .Version }} --platform=linux/amd64"
      - "ghcr.io/ghcr.io/spiffe/spiffefs:{{ .Version }} --platform=linux/arm64"
      
    build_flag_templates:
      - "--platform=linux/{{ .Arch }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"

