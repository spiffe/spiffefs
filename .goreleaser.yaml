# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: .
    binary: spiffefs

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers:
  - image_templates:
      - "ghcr.io/spiffe/spiffefs:{{ .Version }}-amd64"
    use: buildx
    goarch: amd64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"

  - image_templates:
      - "ghcr.io/spiffe/spiffefs:{{ .Version }}-arm64"
    use: buildx
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"

docker_manifests:
  - name_template: "ghcr.io/spiffe/spiffefs:{{ .Version }}"
    image_templates:
      - "ghcr.io/spiffe/spiffefs:{{ .Version }}-amd64"
      - "ghcr.io/spiffe/spiffefs:{{ .Version }}-arm64"
  - name_template: "ghcr.io/spiffe/spiffefs:latest"
    image_templates:
      - "ghcr.io/spiffe/spiffefs:{{ .Version }}-amd64"
      - "ghcr.io/spiffe/spiffefs:{{ .Version }}-arm64"
